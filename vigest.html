<!-- ===== GOATCOUNTER: SEGUIMIENTO ===== -->
<script data-goatcounter="https://edbetgar.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

<!-- ===== GOATCOUNTER: CONTADOR PERSONALIZADO ===== -->
<script>
  (function() {
    'use strict';

    var SITE_URL = 'https://edbetgar.goatcounter.com';
    var DEBUG = true; // Cambia a false cuando todo funcione

    function log() {
      if (DEBUG) console.log.apply(console, ['[VIGEST Stats]'].concat(Array.prototype.slice.call(arguments)));
    }

    function getDateString(offset) {
      var d = new Date();
      if (offset) d.setDate(d.getDate() + offset);
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + m + day;
    }

    // Registra una visita diaria usando el pixel público (100% confiable)
    function trackDaily() {
      var today = getDateString(0);
      var img = new Image();
      img.src = SITE_URL + '/count?p=' + 'visita-' + today + '&rnd=' + Date.now();
      log('Tracking daily visit:', today);
    }

    // Consulta el API público con manejo de errores
    function fetchCount(path) {
      var url = SITE_URL + '/counter/' + path + '.json';
      log('Fetching:', url);
      return fetch(url, { method: 'GET', mode: 'cors' })
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(data) {
          log('Data received for', path, ':', data);
          return parseInt(data.count) || 0;
        });
    }

    function animateNumber(el, target) {
      if (!el) return;
      if (target <= 0) { el.textContent = '0'; return; }
      var duration = 1500;
      var start = performance.now();
      function step(now) {
        var progress = Math.min((now - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(eased * target).toLocaleString('es-CU');
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    // Prueba varias rutas hasta encontrar la que devuelve datos
    async function findTotalPath() {
      var paths = [
        'vigest/vigest.html',
        'vigest.html',
        'vigest/',
        'vigest'
      ];
      for (var i = 0; i < paths.length; i++) {
        try {
          var count = await fetchCount(paths[i]);
          if (count > 0) {
            log('Total path found:', paths[i], '=', count);
            return { path: paths[i], count: count };
          }
        } catch (e) {
          log('Failed path:', paths[i], e.message);
        }
      }
      return { path: null, count: 0 };
    }

    async function loadStats() {
      // ===== HOY =====
      try {
        var todayPath = 'visita-' + getDateString(0);
        var todayCount = await fetchCount(todayPath);
        log('HOY:', todayCount);
        animateNumber(document.getElementById('stat-today'), todayCount);
      } catch (e) {
        log('Error HOY:', e.message);
        document.getElementById('stat-today').textContent = '0';
      }

      // ===== ÚLTIMOS 7 DÍAS =====
      try {
        var weekTotal = 0;
        for (var i = 0; i < 7; i++) {
          try {
            var c = await fetchCount('visita-' + getDateString(-i));
            weekTotal += c;
          } catch (e) {
            log('Error día', i, ':', e.message);
          }
        }
        log('SEMANA:', weekTotal);
        animateNumber(document.getElementById('stat-week'), weekTotal);
      } catch (e) {
        log('Error SEMANA:', e.message);
        document.getElementById('stat-week').textContent = '0';
      }

      // ===== TOTAL HISTÓRICO =====
      try {
        var totalResult = await findTotalPath();
        log('TOTAL:', totalResult.count);
        animateNumber(document.getElementById('stat-total'), totalResult.count);
      } catch (e) {
        log('Error TOTAL:', e.message);
        document.getElementById('stat-total').textContent = '0';
      }
    }

    // Iniciar: registrar visita y luego cargar stats
    trackDaily();
    setTimeout(loadStats, 2000);
  })();
</script>
